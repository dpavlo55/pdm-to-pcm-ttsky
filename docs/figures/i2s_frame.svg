<text x="530" y="216" font-family="Arial, Helvetica, sans-serif" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#52606d">LRCLK switches one BCLK before the MSB. LRCLK = 0: left, 1: right. 32 BCLK per frame (... = bits 12 to 2).</text>
